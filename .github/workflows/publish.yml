name: Publish to Comfy registry

# Publish a GitHub release tagged v<version> to publish that version.
# If a publish fails, run this workflow by hand from main to try again.
# Needs a REGISTRY_ACCESS_TOKEN repository secret from registry.comfy.org.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-node:
    name: Publish custom node to registry
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches pyproject.toml
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      # The 1.0.1 tag is from 2024 and calls a comfy-cli option that no longer exists.
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
