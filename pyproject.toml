[project]
name = "comfyui-dailies"
version = "0.1.4"
description = "Never lose which seed, model, LoRA and prompt made a clip. Writes a take.json beside every rendered video so any take can be found, reproduced or rerun later, and a night of renders can be ranked without reopening ComfyUI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Liz Zhang", email = "hello.liz.zhang@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["video-dailies>=0.2,<0.3"]
keywords = ["comfyui", "video", "lineage", "metadata", "sidecar", "qc", "dailies"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/zhang-liz/comfyui-dailies"
Documentation = "https://github.com/zhang-liz/comfyui-dailies#readme"
"Bug Tracker" = "https://github.com/zhang-liz/comfyui-dailies/issues"
Changelog = "https://github.com/zhang-liz/comfyui-dailies/blob/main/CHANGELOG.md"
Spec = "https://github.com/zhang-liz/dailies/blob/main/SPEC.md"

[tool.comfy]
PublisherId = "zhang-liz"
DisplayName = "Dailies Take Recorder"
Icon = "https://raw.githubusercontent.com/zhang-liz/comfyui-dailies/main/icon.svg"
