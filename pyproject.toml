[project]
name = "comfyui-dailies"
version = "0.1.0"
description = "Write a take.json lineage sidecar beside every video ComfyUI renders: content hash, seeds, models, LoRAs, prompt, resolved graph."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Liz Zhang", email = "hello.liz.zhang@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["video-dailies @ git+https://github.com/zhang-liz/dailies"]
keywords = ["comfyui", "video", "lineage", "metadata", "sidecar", "qc", "dailies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/zhang-liz/comfyui-dailies"
Issues = "https://github.com/zhang-liz/comfyui-dailies/issues"
Changelog = "https://github.com/zhang-liz/comfyui-dailies/blob/main/CHANGELOG.md"
Spec = "https://github.com/zhang-liz/dailies/blob/main/SPEC.md"

[tool.comfy]
PublisherId = "zhang-liz"
DisplayName = "Dailies"
Icon = ""
